<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" fill="none">
  <defs>
    <filter id="cardDepth" x="-10%" y="-10%" width="120%" height="128%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="metalRim" x1="0" y1="0" x2="480" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E6ED"/>
      <stop offset="50%" stop-color="#B8C0CC"/>
      <stop offset="100%" stop-color="#DCE1E8"/>
    </linearGradient>
    <linearGradient id="altScreen" x1="16" y1="16" x2="464" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141922"/>
      <stop offset="100%" stop-color="#0C1016"/>
    </linearGradient>
    <linearGradient id="altGlare" x1="16" y1="16" x2="260" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#cardDepth)">
    <!-- Metallic Rim Shell -->
    <rect x="10" y="10" width="460" height="320" rx="20" fill="url(#metalRim)" stroke="#9DA6B4" stroke-width="1"/>
    <rect x="15" y="15" width="450" height="310" rx="16" fill="#0E1218"/>
    <rect x="19" y="19" width="442" height="302" rx="13" fill="url(#altScreen)"/>

    <!-- Top Bar -->
    <rect x="19" y="19" width="442" height="35" rx="13" fill="#171D27"/>
    <rect x="19" y="42" width="442" height="12" fill="#171D27"/>
    <line x1="19" y1="54" x2="461" y2="54" stroke="#242C3A" stroke-width="1"/>
    <circle cx="37" cy="36" r="4" fill="#EF6461"/>
    <circle cx="51" cy="36" r="4" fill="#F2B84B"/>
    <circle cx="65" cy="36" r="4" fill="#1FA35A"/>
    <text x="84" y="40" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">Bot Controls &amp; Activity</text>
    <rect x="372" y="27" width="76" height="18" rx="9" fill="#153424" stroke="#1FA35A" stroke-opacity="0.45"/>
    <circle cx="383" cy="36" r="2.8" fill="#26C66F"/>
    <text x="390" y="39" fill="#9AE6B4" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600">Bot Connected</text>

    <!-- Control Strip -->
    <rect x="33" y="66" width="414" height="58" rx="10" fill="#161C26" stroke="#253041"/>
    <circle cx="53" cy="95" r="7" fill="#1FA35A"/>
    <rect x="69" y="87" width="88" height="6.5" rx="3.25" fill="#E2E8F0"/>
    <rect x="69" y="99" width="58" height="5" rx="2.5" fill="#64748B"/>
    <rect x="244" y="81" width="56" height="28" rx="7" fill="#1FA35A"/>
    <text x="272" y="98.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">Start</text>
    <rect x="308" y="81" width="56" height="28" rx="7" fill="#252E3D"/>
    <text x="336" y="98.5" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Pause</text>
    <rect x="372" y="81" width="56" height="28" rx="7" fill="#2C1F24" stroke="#EF6461" stroke-opacity="0.45"/>
    <text x="400" y="98.5" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600">Stop</text>

    <!-- Split Panels -->
    <rect x="33" y="136" width="252" height="168" rx="10" fill="#131822" stroke="#253041"/>
    <path d="M49 266 L84 248 L118 254 L152 216 L186 225 L220 184 L264 166" stroke="#22B866" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="186" width="130" height="22" rx="4" fill="#1FA35A" fill-opacity="0.16" stroke="#1FA35A" stroke-opacity="0.45" stroke-dasharray="4 3"/>

    <rect x="297" y="136" width="150" height="168" rx="10" fill="#131822" stroke="#253041"/>
    <rect x="311" y="152" width="76" height="6" rx="3" fill="#94A3B8"/>
    <rect x="311" y="172" width="122" height="26" rx="6" fill="#1B2331"/>
    <circle cx="323" cy="185" r="3.5" fill="#1FA35A"/>
    <rect x="333" y="182" width="74" height="5.5" rx="2.75" fill="#CBD5E1"/>
    <rect x="311" y="206" width="122" height="26" rx="6" fill="#1B2331"/>
    <circle cx="323" cy="219" r="3.5" fill="#38BDF8"/>
    <rect x="333" y="216" width="66" height="5.5" rx="2.75" fill="#CBD5E1"/>
    <rect x="311" y="240" width="122" height="26" rx="6" fill="#1B2331"/>
    <circle cx="323" cy="253" r="3.5" fill="#F2B84B"/>
    <rect x="333" y="250" width="80" height="5.5" rx="2.75" fill="#CBD5E1"/>

    <!-- Glass Sheen -->
    <path d="M19 19 H260 L120 321 H19 V19 Z" fill="url(#altGlare)"/>
  </g>
</svg>
