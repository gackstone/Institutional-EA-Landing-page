<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390" fill="none">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="560" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14181F"/>
      <stop offset="100%" stop-color="#0E1117"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="280" y1="120" x2="280" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1FA35A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1FA35A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2F38"/>
      <stop offset="100%" stop-color="#181C23"/>
    </linearGradient>
  </defs>

  <!-- Outer Device Frame -->
